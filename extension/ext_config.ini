; Headlights: 14 of the 16 materials in the kn5 have ksDiffuse = 0, so they ignore every light but ambient, car
; headlights included. This gives the road, the start line, the ground, the tunnel and the wall some diffuse at load
; time. Ambient comes down from 0.7 so the daytime look does not wash out once the sun reaches them.
[SHADER_REPLACEMENT_0]
ACTIVE = 1
DESCRIPTION = Let car headlights and the sun light the road, ground, tunnel and wall
MATERIALS = Material.023, Material.006, Material.018, Material.017, Material, Material.024, Material.027, Material.025
PROP_0 = ksAmbient, 0.45
PROP_1 = ksDiffuse, 0.35
